<svg xmlns="http://www.w3.org/2000/svg" width="270" height="48" viewBox="0 0 270 48" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn — Samuel Uchoa</title>
  <desc id="desc">Blue LinkedIn badge with a gentle repeating light sweep.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a66c2"/><stop offset="1" stop-color="#084984"/></linearGradient>
    <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".17"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="bounds"><rect x="1" y="1" width="268" height="46" rx="9"/></clipPath>
    <style>
      .shine{animation:sweep 9s ease-in-out infinite}
      .edge{animation:breathe 6s ease-in-out infinite}
      @keyframes sweep{0%,18%{transform:translateX(-85px)}65%,100%{transform:translateX(285px)}}
      @keyframes breathe{0%,100%{stroke-opacity:.3}50%{stroke-opacity:.65}}
      @media(prefers-reduced-motion:reduce){.shine{display:none}.edge{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="268" height="46" rx="9" fill="url(#background)"/>
  <g clip-path="url(#bounds)"><rect class="shine" x="-5" y="0" width="75" height="48" fill="url(#shine)"/></g>
  <rect x="14" y="13" width="22" height="22" rx="2" fill="#fff"/>
  <g fill="#0a66c2"><circle cx="19.5" cy="18.5" r="1.6"/><path d="M18 22h3v10h-3zm5 0h3v1.3c.9-1.3 2.1-1.6 3.1-1.6 2.6 0 3.4 1.7 3.4 4.2V32h-3v-5.3c0-1.5-.4-2.3-1.5-2.3-1.3 0-2 .9-2 2.5V32h-3z"/></g>
  <path d="M48 13v22" stroke="#fff" stroke-opacity=".25"/>
  <text x="61" y="29.5" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#fff">LinkedIn · Samuel Uchoa</text>
  <rect class="edge" x="1" y="1" width="268" height="46" rx="9" fill="none" stroke="#87d4ff" stroke-opacity=".3"/>
</svg>
