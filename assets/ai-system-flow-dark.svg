<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Connected intelligence — neural-inspired RAG system</title>
<desc id="desc">An animated neural network illustrates connected AI. The README explains knowledge indexing and question answering separately. This is a visual metaphor, not a model's actual neural architecture.</desc>
